[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vlkg-mcp"
version = "0.1.0"
description = "MCP server exposing the V-LKG knowledge graph and intelligence surface"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
]

[project.scripts]
vlkg-mcp = "vlkg_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/vlkg_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
